name: Deploy Blender Extension Repository

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Process Manifest and Generate Repository
        shell: bash
        run: |
          # 1. Récupération et nettoyage de la version du Tag GitHub
          TAG_VERSION="${{ github.event.release.tag_name }}"
          CLEAN_VERSION=$(echo "$TAG_VERSION" | sed 's/^v//')
          echo "Version détectée : $CLEAN_VERSION"

          # 2. Script Python pour mettre à jour le manifest et créer l'index.json en UTF-8
          python -c "
          import json, re, os

          # Lecture forcée en UTF-8 pour éviter l'erreur d'encodage
          with open('bl_ext_manifest.toml', 'r', encoding='utf-8') as f:
              content = f.read()
          
          if 'version =' in content:
              content = re.sub(r'^version\s*=\s*.*', f'version = \"{CLEAN_VERSION}\"', content, flags=re.MULTILINE)
          else:
              content += f'\nversion = \"{CLEAN_VERSION}\"\n'
              
          # Écriture forcée en UTF-8
          with open('bl_ext_manifest.toml', 'w', encoding='utf-8') as f:
              f.write(content)

          match = re.search(r'^id\s*=\s*\"([^\"]+)\"', content, re.MULTILINE)
          addon_id = match.group(1) if match else 'bonk'

          index_data = {
              'schema_version': '1.0.0',
              'extensions': [
                  {
                      'id': addon_id,
                      'version': '${{ github.event.release.tag_name }}'.replace('v', ''),
                      'archive_url': f'https://github.io{addon_id}.zip',
                      'archive_size': 0, 
                      'archive_hash': ''
                  }
              ]
          }

          os.makedirs('docs/extensions', exist_ok=True)
          with open('docs/index.json', 'w', encoding='utf-8') as f:
              json.dump(index_data, f, indent=4)
          print('Manifest mis à jour et index.json généré en UTF-8 !')
          "

      - name: Create Zip Package
        run: |
          # Compresse les fichiers dans le dossier final docs/extensions/
          zip -r docs/extensions/bonk.zip * -x "docs*" "README.md" ".git*"

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: docs/extensions/*.zip

      - name: Deploy to Main Branch
        uses: mikeal/publish-to-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: 'main'
