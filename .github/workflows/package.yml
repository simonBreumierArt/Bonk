name: Deploy Blender Extension Repository

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Permet d'avoir tout l'historique pour les pushs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update Version in Manifest
        shell: bash
        run: |
          # 1. Récupère le tag de la release (ex: v1.2.3)
          TAG_VERSION="${{ github.event.release.tag_name }}"
          
          # 2. Nettoie le 'v' initial (ex: 1.2.3)
          CLEAN_VERSION=$(echo "$TAG_VERSION" | sed 's/^v//')
          echo "Mise à jour du manifest avec la version : $CLEAN_VERSION"
          
          # 3. Remplace directement la ligne version = "..." dans le fichier TOML
          sed -i "s/^version = .*/version = \"$CLEAN_VERSION\"/" bl_ext_manifest.toml


      - name: Download Blender CLI Tool
        run: |
          pip install blender-extensions-cli

      - name: Build Repository Structure
        run: |
          # Crée un sous dossier de travail temporaire pour isoler l'extension
          mkdir -p build_dir/bonk
          
          # Copie proprement vos fichiers de dev dans ce sous-dossier
          rsync -av --progress . build_dir/bonk/ --exclude build_dir --exclude .git --exclude .github --exclude README.md
          
          # Crée le catalogue final dans un dossier nommé "docs" (idéal pour GitHub Pages)
          mkdir -p docs
          blender-extensions-cli build --source-dir=build_dir/bonk --output-dir=docs
          blender-extensions-cli server-generate --repo-dir=docs

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: docs/*.zip

      - name: Deploy to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Chore: Update extension repository index [skip ci]"
          git push origin main
