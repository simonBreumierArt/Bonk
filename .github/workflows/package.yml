name: Deploy Blender Extension Repository

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Process Manifest and Generate Repository
        shell: bash
        # On passe proprement la version nettoyée à l'environnement global de l'étape
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # 1. Nettoyage du 'v' initial de la version en Bash
          CLEAN_VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
          echo "Version détectée : $CLEAN_VERSION"
          
          # On exporte la variable pour que le sous-processus Python puisse la lire
          export ASSIGNED_VERSION="$CLEAN_VERSION"

          # 2. Script Python autonome utilisant l'environnement sécurisé
          python -c "
          import json, re, os

          # Récupération de la version depuis l'environnement système
          clean_version = os.environ.get('ASSIGNED_VERSION', '1.0.0')

          # Lecture forcée en UTF-8 pour éviter l'erreur d'encodage
          with open('bl_ext_manifest.toml', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Remplacement propre de la version dans le fichier TOML
          if 'version =' in content:
              content = re.sub(r'^version\s*=\s*.*', f'version = \"{clean_version}\"', content, flags=re.MULTILINE)
          else:
              content += f'\nversion = \"{clean_version}\"\n'
              
          with open('bl_ext_manifest.toml', 'w', encoding='utf-8') as f:
              f.write(content)

          # Récupération de l'ID de l'addon depuis le manifest
          match = re.search(r'^id\s*=\s*\"([^\"]+)\"', content, re.MULTILINE)
          addon_id = match.group(1) if match else 'bonk'

          # Génération de la structure JSON de l'index avec l'URL absolue complète
          index_data = {
              'schema_version': '1.0.0',
              'extensions': [
                  {
                      'id': addon_id,
                      'version': clean_version,
                      'archive_url': f'https://github.io{addon_id}.zip',
                      'archive_size': 0, 
                      'archive_hash': ''
                  }
              ]
          }

          os.makedirs('docs/extensions', exist_ok=True)
          with open('docs/index.json', 'w', encoding='utf-8') as f:
              json.dump(index_data, f, indent=4)
          print('Manifest mis a jour et index.json genere avec succes !')
          "

      - name: Create Zip Package
        run: |
          # Compresse les fichiers dans le dossier final docs/extensions/
          zip -r docs/extensions/bonk.zip * -x "docs*" "README.md" ".git*"

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: docs/extensions/*.zip

      - name: Deploy to Main Branch
        uses: mikeal/publish-to-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: 'main'
