name: Deploy Blender Extension Repository

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Update Version in Manifest
        shell: bash
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          CLEAN_VERSION=$(echo "$TAG_VERSION" | sed 's/^v//')
          echo "Mise à jour du manifest avec la version : $CLEAN_VERSION"
          sed -i "s/^version = .*/version = \"$CLEAN_VERSION\"/" bl_ext_manifest.toml

      - name: Create Zip Package
        run: |
          mkdir -p docs
          # Remplacez "bonk.zip" par le nom souhaité pour l'archive de votre addon
          zip -r docs/bonk.zip * -x "docs*" "build_dir*" "README.md" ".git*"

      - name: Generate Extension Index JSON
        shell: bash
        run: |
          # Script Python autonome qui lit votre manifest.toml pour créer l'index.json requis par Blender
          python -c "
          import json, re

          with open('bl_ext_manifest.toml', 'r') as f:
              content = f.read()

          def get_val(key):
              match = re.search(rf'^{key}\s*=\s*\"([^\"]+)\"', content, re.MULTILINE)
              return match.group(1) if match else ''

          addon_id = get_val('id')
          version = get_val('version')

          index_data = {
              'schema_version': '1.0.0',
              'extensions': [
                  {
                      'id': addon_id,
                      'version': version,
                      'archive_url': f'extensions/{addon_id}.zip',
                      'archive_size': 0, 
                      'archive_hash': ''
                  }
              ]
          }

          # Création de l'arborescence finale pour GitHub Pages
          import os
          os.makedirs('docs/extensions', exist_ok=True)
          
          # Déplacement du fichier ZIP généré dans le bon dossier attendu par l'index
          os.rename('docs/bonk.zip', f'docs/extensions/{addon_id}.zip')

          with open('docs/index.json', 'w') as f:
              json.dump(index_data, f, indent=4)
          print('Fichier index.json généré avec succès !')
          "

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: docs/extensions/*.zip

      - name: Deploy to Main Branch
        uses: mikeal/publish-to-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: 'main'
