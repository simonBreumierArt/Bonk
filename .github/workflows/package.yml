name: Deploy Blender Extension Repository

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

            - name: Build Pure UTF-8 Repository
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          CLEAN_VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
          
          # On crée proprement nos répertoires cibles
          mkdir -p staging_dir
          mkdir -p docs/extensions

          # On passe la version propre au script Python via l'environnement système pour éliminer les conflits de guillemets
          export ASSIGNED_VERSION="$CLEAN_VERSION"

          python -c "
          import os, json

          clean_version = os.environ.get('ASSIGNED_VERSION', '1.0.0')

          # 1. Génération du manifest TOML stérile
          manifest_content = f'''schema_version = \"1.0.0\"
          id = \"bonk\"
          version = \"{clean_version}\"
          title = \"Bonk Toolset\"
          tagline = \"Tools for modeling.\"
          maintainer = \"Simon Breumier\"
          type = \"add-on\"
          blender_version_min = \"4.2.0\"
          '''

          with open('staging_dir/bl_ext_manifest.toml', 'w', encoding='utf-8', newline='\n') as f:
              f.write(manifest_content)

          # 2. Génération de l'index.json stérile et STRICTEMENT encodé sans injection de chaîne Bash directe
          index_data = {
              'schema_version': '1.0.0',
              'extensions': [
                  {
                      'id': 'bonk',
                      'version': clean_version,
                      'archive_url': f'https://github.io',
                      'archive_size': 0, 
                      'archive_hash': ''
                  }
              ]
          }

          with open('docs/index.json', 'w', encoding='utf-8', newline='\n') as f:
              json.dump(index_data, f, indent=4)
          print('index.json valide généré en UTF-8 !')
          "

          # 3. Copie des fichiers Python et compression
          cp *.py staging_dir/
          cd staging_dir
          zip -r ../docs/extensions/bonk.zip .
          cd ..


      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: docs/extensions/bonk.zip

      - name: Deploy to Main Branch
        uses: mikeal/publish-to-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: 'main'
