name: Deploy Blender Extension Repository

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Build Pure UTF-8 Repository
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          CLEAN_VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
          
          mkdir -p staging_dir
          mkdir -p docs/extensions

          export ASSIGNED_VERSION="$CLEAN_VERSION"

          # Utilisation de guillemets simples pour encapsuler le script Python sans casser le YAML
          python -c '
          import os, json

          clean_version = os.environ.get("ASSIGNED_VERSION", "1.0.0")

          # Génération ligne par ligne du manifest pour éviter les triples apostrophes conflictuelles
          lines = [
              "schema_version = \"1.0.0\"",
              f"id = \"bonk\"",
              f"version = \"{clean_version}\"",
              "title = \"Bonk Toolset\"",
              "tagline = \"Tools for modeling.\"",
              "maintainer = \"Simon Breumier\"",
              "type = \"add-on\"",
              "blender_version_min = \"4.2.0\""
          ]
          manifest_content = "\n".join(lines) + "\n"

          with open("staging_dir/bl_ext_manifest.toml", "w", encoding="utf-8", newline="\n") as f:
              f.write(manifest_content)

          index_data = {
              "schema_version": "1.0.0",
              "extensions": [
                  {
                      "id": "bonk",
                      "version": clean_version,
                      "archive_url": f"https://github.io",
                      "archive_size": 0, 
                      "archive_hash": ""
                  }
              ]
          }

          with open("docs/index.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(index_data, f, indent=4)
          print("index.json valide généré en UTF-8 !")
          '

          # Copie des fichiers de script et compression
          cp *.py staging_dir/
          cd staging_dir
          zip -r ../docs/extensions/bonk.zip .
          cd ..

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: docs/extensions/bonk.zip

      - name: Deploy to Main Branch
        uses: mikeal/publish-to-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: 'main'
